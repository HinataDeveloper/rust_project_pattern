[package]
name = "redis_client"
version = "0.1.0"
edition = "2024"
rust-version = "1.101"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_must_use = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# print_stdout = "warn"
# print_stderr = "warn"
clone_on_ref_ptr = "warn"

# [dependencies.redis]
# version = "*"

[dependencies]

[[bin]]
name = "redis-client"
path = "src/main.rs"
